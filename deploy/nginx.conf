# Ostensory 反向代理示例（宿主机 nginx）
# 把 bed.com 和证书路径换成你自己的；HTTP 会 301 到 HTTPS。

limit_req_zone $binary_remote_addr zone=ostensory_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name bed.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bed.com;

    ssl_certificate     /etc/letsencrypt/live/bed.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bed.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 220m;
    client_body_timeout 300s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /static/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}