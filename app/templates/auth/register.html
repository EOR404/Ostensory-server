{% extends "base.html" %}
{% block body_class %} page-auth{% endblock %}
{% block title %}{{ page_title }} · {{ settings.site_name }}{% endblock %}
{% block content %}
<section class="auth-shell">
  <div class="auth-card">
    <p class="eyebrow">JOIN</p>
    <h1>注册</h1>
    <p class="muted">使用用户名和密码注册。请不要使用与其他网站相同的密码。</p>
    <form method="post" action="/register" class="auth-form">
      <input type="hidden" name="csrf" value="{{ csrf_token }}">
      <label>用户名<input name="username" minlength="3" maxlength="64" pattern="[A-Za-z0-9_.@-]{3,64}" autocomplete="username" required autofocus></label>
      <label>显示名称 <span class="muted small">可选，会显示在作品署名中</span><input name="display_name" maxlength="40" autocomplete="nickname"></label>
      <label>密码<input name="password" type="password" minlength="8" maxlength="200" autocomplete="new-password" required></label>
      <label>确认密码<input name="password2" type="password" minlength="8" maxlength="200" autocomplete="new-password" required></label>
      <button class="button" type="submit">创建账号</button>
    </form>
    <p class="auth-switch">已经有账号？<a href="/login">登录</a></p>
  </div>
</section>
{% endblock %}
